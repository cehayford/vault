{% extends 'base.html' %}
{% block head %}<title>Add ballot</title>{% endblock %}
{% block content %}
<div class="min-h-screen bg-amber-50 px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-6 mb-6">
            <h2 class="font-mono font-bold text-amber-900 uppercase text-sm">Election (read-only)</h2>
            <p class="font-mono text-amber-900 mt-1">{{ election.title }}</p>
        </div>
        <div class="bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-8">
            <h1 class="text-xl font-mono font-bold uppercase tracking-widest text-amber-900 border-b-4 border-black pb-4 mb-6">ADD BALLOT</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="mt-4 px-6 py-3 bg-black text-white font-mono uppercase tracking-widest border-4 border-black hover:bg-amber-900 transition-all">ADD BALLOT</button>
            </form>
        </div>
        <p class="mt-4"><a href="{% url 'voting:election_detail' election.pk %}" class="font-mono text-amber-900 underline">Back to election</a></p>
    </div>
</div>
{% endblock %}
