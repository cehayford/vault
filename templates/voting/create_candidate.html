{% extends 'base.html' %}
{% block head %}<title>Create candidate</title>{% endblock %}
{% block content %}
<div class="min-h-screen bg-amber-50 px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-8">
        <h1 class="text-xl font-mono font-bold uppercase tracking-widest text-amber-900 border-b-4 border-black pb-4 mb-6">CREATE CANDIDATE</h1>
        <form method="post" enctype="multipart/form-data" id="candidate-form">
            {% csrf_token %}
            {{ form.as_p }}
            <div id="photo-preview" class="mt-2 hidden"><img id="preview-img" src="" alt="Preview" class="w-32 h-32 object-cover border-4 border-black"></div>
            <button type="submit" class="mt-4 px-6 py-3 bg-black text-white font-mono uppercase tracking-widest border-4 border-black hover:bg-amber-900 transition-all">CREATE</button>
        </form>
        <p class="mt-4"><a href="{% url 'voting:candidate_list' %}" class="font-mono text-amber-900 underline">Back to list</a></p>
    </div>
</div>
<script>
document.querySelector('input[name="photo"]')?.addEventListener('change', function(e) {
    var f = e.target.files[0];
    var div = document.getElementById('photo-preview');
    var img = document.getElementById('preview-img');
    if (f && /^image\//.test(f.type)) { img.src = URL.createObjectURL(f); div.classList.remove('hidden'); }
    else { div.classList.add('hidden'); }
});
</script>
{% endblock %}
