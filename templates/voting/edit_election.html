{% extends 'base.html' %}
{% block head %}<title>Edit election</title>{% endblock %}
{% block content %}
<div class="min-h-screen py-8">
    <div class="max-w-container mx-auto px-container-x">
        <p class="mb-4"><a href="{% url 'voting:election_detail' election.pk %}" class="text-accent font-medium text-sm hover:text-accent-hover">← Back to election</a></p>
        <h1 class="text-2xl font-display font-bold text-foreground tracking-tight border-b border-border pb-4 mb-6">Edit election</h1>
        <div class="card p-6 border border-border max-w-2xl">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="flex gap-4 pt-2">
                    <button type="submit" class="btn-primary py-2.5 px-6 text-sm">Save changes</button>
                    <a href="{% url 'voting:election_detail' election.pk %}" class="btn-secondary py-2.5 px-6 text-sm">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
