{% load static %} <!-- Standardized Card Component --> <div class="card {{ css_class|default:'' }}" data-animate-delay="{{ delay|default:'0' }}"> {% if header %} <div class="card-header {{ header_class|default:'' }}"> {% if icon %} <div class="card-icon"> <i data-lucide="{{ icon }}" class="w-5 h-5"></i> </div> {% endif %} {% if title %} <h3 class="card-title">{{ title }}</h3> {% endif %} {% if subtitle %} <p class="card-subtitle">{{ subtitle }}</p> {% endif %} </div> {% endif %} <div class="card-body {{ body_class|default:'' }}"> {{ content }} </div> {% if footer %} <div class="card-footer {{ footer_class|default:'' }}"> {{ footer }} </div> {% endif %} </div> <style> /* Card Component Styles */ .card { background-color: var(--color-surface-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; transition: all var(--anim-duration-fast) var(--anim-ease-out); } .card:hover { box-shadow: var(--shadow-deep); transform: translateY(-2px); } .card-header { padding: var(--space-6); border-bottom: 1px solid var(--color-border); background-color: var(--color-bg-secondary); } .card-body { padding: var(--space-6); } .card-footer { padding: var(--space-6); border-top: 1px solid var(--color-border); background-color: var(--color-bg-secondary); } .card-icon { display: flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; background-color: var(--color-accent-primary); color: var(--color-text-inverse); border-radius: var(--radius-md); margin-right: var(--space-3); } .card-title { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary); margin: 0; } .card-subtitle { font-size: var(--font-size-sm); color: var(--color-text-muted); margin: var(--space-1) 0 0 0; } /* Card Variants */ .card--compact .card-header, .card--compact .card-body, .card--compact .card-footer { padding: var(--space-4); } .card--elevated { box-shadow: var(--shadow-deep); } .card--borderless { border: none; } .card--interactive { cursor: pointer; } .card--interactive:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(21, 31, 30, 0.15); } /* Animation Classes */ .card-animate { opacity: 0; transform: translateY(20px); animation: fadeInUp var(--anim-duration-base) var(--anim-ease-out) forwards; animation-delay: var(--animate-delay, 0ms); } .card-tilt { --tilt-x: 0deg; --tilt-y: 0deg; transform-style: preserve-3d; will-change: transform; transition: transform var(--anim-duration-fast) var(--anim-ease-out); } .card-tilt:hover { transform: perspective(1000px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)); } /* Dark theme adjustments */ [data-theme="dark"] .card { background-color: var(--color-surface-card); border-color: var(--color-border); } [data-theme="dark"] .card-header, [data-theme="dark"] .card-footer { background-color: var(--color-bg-secondary); border-color: var(--color-border); } </style>
