{% extends "base.html" %}
{% load static %}

{% block head %}
    <title>Home - Vault Voting System</title>
{% endblock %}

{% block content %}
<div class="min-h-screen bg-white flex flex-col items-center justify-center px-4 py-6 relative overflow-hidden">
    <div class="absolute inset-0 opacity-5">
        <div class="absolute inset-0" style="background-image: repeating-linear-gradient(0deg, black, black 1px, transparent 1px, transparent 40px), repeating-linear-gradient(90deg, black, black 1px, transparent 1px, transparent 40px);"></div>
    </div>
    
    <div class="max-w-5xl w-full text-center relative z-10">
        <!-- Main Title Section -->
        <div class="mb-8 md:mb-12">
            <div class="inline-block bg-black px-4 py-2 md:px-8 md:py-4 mb-4 md:mb-6 border-4 md:border-8 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] md:shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] transform -rotate-2">
                <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-bold leading-none tracking-tighter">
                    <span class="text-white font-mono uppercase">
                        VAULT
                    </span>
                </h1>
            </div>
            <div class="bg-white border-2 border-black inline-block px-4 py-2 md:px-8 md:py-3 transform rotate-1">
                <span class="text-lg sm:text-2xl md:text-3xl lg:text-4xl font-bold text-black tracking-wider md:tracking-widest uppercase font-mono">
                    VOTING SYSTEM
                </span>
            </div>
        </div>

        <!-- Description -->
        <div class="mb-6 md:mb-8 max-w-3xl mx-auto">
            <div class="bg-white border-2 md:border-4 border-black p-4 md:p-8 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] md:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                <p class="text-sm sm:text-base md:text-lg lg:text-xl text-black font-mono leading-relaxed uppercase tracking-wide">
                    CREATE POLLS, MANAGE CAMPAIGNS, AND COLLECT VOTES WITH OUR SECURE AND EASY-TO-USE PLATFORM.
                </p>
            </div>
        </div>
        
        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 md:gap-6 justify-center items-center mb-8 md:mb-12">
            <a href="{% url 'userauth:signup' %}" 
               class="inline-flex items-center justify-center px-6 py-4 md:px-10 md:py-6 bg-black text-white font-bold text-sm md:text-base lg:text-lg uppercase tracking-wider md:tracking-widest border-2 md:border-4 border-black hover:bg-white hover:text-black transition-all duration-200 transform hover:translate-x-1 hover:translate-y-1 md:hover:translate-x-2 md:hover:translate-y-2 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] md:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] hover:shadow-none w-full sm:w-auto">
                <svg class="w-4 h-4 md:w-6 md:h-6 mr-2 md:mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
                GET STARTED FREE
            </a>
            
            <a href="{% url 'userauth:login' %}" 
               class="inline-flex items-center justify-center px-6 py-4 md:px-10 md:py-6 bg-white text-black font-bold text-sm md:text-base lg:text-lg uppercase tracking-wider md:tracking-widest border-2 md:border-4 border-black hover:bg-black hover:text-white transition-all duration-200 transform hover:translate-x-1 hover:translate-y-1 md:hover:translate-x-2 md:hover:translate-y-2 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] md:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] hover:shadow-none w-full sm:w-auto">
                <svg class="w-4 h-4 md:w-6 md:h-6 mr-2 md:mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
                SIGN IN
            </a>
        </div>
    </div>
</div>
{% endblock %}
