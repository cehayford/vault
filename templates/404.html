{% extends 'base.html' %}
{% load static %}

{% block head %}
    <title>Page not Found</title>
{% endblock %}

{% block content %}
<div class="bg-white min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
    <!-- Brutalist Background Pattern -->
    <div class="absolute inset-0 opacity-5">
        <div class="absolute inset-0" style="background-image: repeating-linear-gradient(0deg, black, black 2px, transparent 2px, transparent 20px), repeating-linear-gradient(90deg, black, black 2px, transparent 2px, transparent 20px);"></div>
    </div>
    
    <div class="text-center relative z-10">
        <div class="bg-white border-8 border-black shadow-[24px_24px_0px_0px_rgba(0,0,0,1)] p-16 max-w-3xl mx-auto">
            <h1 class="text-9xl font-bold text-black mb-6 tracking-tighter font-mono leading-none" style="text-shadow: 6px 6px 0px rgba(0,0,0,0.2);">404</h1>
            <div class="bg-black text-white px-8 py-4 mb-6 border-4 border-black inline-block">
                <h2 class="text-3xl font-bold uppercase tracking-wider">PAGE NOT FOUND</h2>
            </div>
            
            <p class="text-lg text-black mb-10 font-mono max-w-lg mx-auto border-l-4 border-black pl-6 text-left">
                SORRY, THE PAGE YOU ARE LOOKING FOR DOES NOT EXIST OR HAS BEEN MOVED.
            </p>
            
            <!-- Home Button -->
            <a href="/" 
               class="inline-flex items-center justify-center px-10 py-5 bg-black text-white font-bold uppercase tracking-widest border-4 border-black hover:bg-white hover:text-black transition-all duration-200 transform hover:translate-x-2 hover:translate-y-2 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] hover:shadow-none text-lg mb-10">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <path stroke-linecap="square" stroke-linejoin="miter" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                GO HOME
            </a>
            
            <!-- Support Link -->
            <div class="mt-10 pt-8 border-t-4 border-black">
                <p class="text-sm text-black font-mono uppercase tracking-wide">
                    NEED HELP? 
                    <a href="#" class="text-black font-bold underline decoration-4 underline-offset-4 hover:bg-black hover:text-white px-2 py-1 transition-all duration-200">
                        CONTACT SUPPORT
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
