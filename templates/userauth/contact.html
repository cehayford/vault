{% extends 'base.html' %}
{% block head %}<title>Contact</title>{% endblock %}
{% block content %}
<div class="min-h-screen px-4 py-12 bg-amber-50">
    <div class="max-w-2xl mx-auto bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-8">
        <h1 class="text-xl font-mono font-bold uppercase tracking-widest text-amber-900 border-b-4 border-black pb-4 mb-6">CONTACT</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mt-4 px-6 py-3 bg-black text-white font-mono uppercase tracking-widest border-4 border-black hover:bg-amber-900 transition-all">SEND</button>
        </form>
    </div>
</div>
{% endblock %}
