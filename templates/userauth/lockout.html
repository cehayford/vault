{% extends 'base.html' %}
{% block head %}<title>Account locked</title>{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 bg-amber-50">
    <div class="max-w-md w-full bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-8 text-center">
        <h1 class="text-xl font-mono font-bold uppercase tracking-widest text-amber-900 border-b-4 border-black pb-4 mb-6">ACCOUNT LOCKED</h1>
        <p class="font-mono text-amber-900 mb-4">Too many failed login attempts. Please try again later.</p>
        <p class="text-sm font-mono"><a href="{% url 'userauth:contact' %}" class="text-amber-900 underline">Contact support</a></p>
    </div>
</div>
{% endblock %}
