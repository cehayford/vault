{% extends 'base.html' %}
{% block footer %}{% endblock %}
{% block head %}<title>Check your email</title>{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 relative overflow-hidden">
    <div class="max-w-md w-full relative z-10">
        <div class="card overflow-hidden shadow-deep">
            <div class="bg-accent px-6 md:px-8 py-5 md:py-6 text-center border-b border-border">
                <div class="flex justify-center mb-2"><i data-lucide="mail-check" class="w-8 h-8 text-inverse"></i></div>
                <h2 class="text-xl md:text-2xl font-display font-bold text-inverse tracking-tight">Check your email</h2>
            </div>
            <div class="px-6 md:px-8 py-6 md:py-8">
                <p class="text-sm text-foreground">If an account exists for that address, we’ve sent password reset instructions. Check your inbox and spam folder.</p>
                <p class="mt-6 text-center"><a href="{% url 'userauth:login' %}" class="text-sm text-muted hover:text-foreground underline">Back to login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
