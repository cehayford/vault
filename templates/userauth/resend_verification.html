{% extends 'base.html' %}
{% load static %}

{% block head %}
    <title>Resend Verification - Vault</title>
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
        <div class="card overflow-hidden shadow-deep border border-border">
            <div class="bg-accent px-6 md:px-8 py-5 md:py-6 text-center border-b border-border">
                <div class="inline-flex items-center justify-center w-12 h-12 mx-auto rounded-full bg-white/20 mb-3">
                    <i data-lucide="send" class="w-6 h-6 text-inverse"></i>
                </div>
                <h2 class="text-xl md:text-2xl font-display font-bold text-inverse tracking-tight">Resend verification email</h2>
            </div>

            <div class="px-6 md:px-8 py-6 md:py-8">
                <p class="text-muted text-sm mb-4">Enter the email you used to sign up. We will send a new verification code.</p>
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <div>
                        <label for="email" class="block text-xs font-semibold text-foreground mb-1.5">Email address</label>
                        <input type="email" name="email" id="email" value="{{ email }}" required
                               class="w-full px-4 py-2.5 text-sm rounded-md border border-border bg-secondary text-foreground focus:border-accent focus:outline-none"
                               placeholder="you@example.com" autocomplete="email">
                    </div>
                    <button type="submit" class="w-full btn-primary py-3 inline-flex items-center justify-center gap-2">
                        <i data-lucide="mail-check" class="w-5 h-5"></i>
                        Send new code
                    </button>
                </form>

                <p class="mt-4 text-center text-muted text-xs">
                    <a href="{% url 'userauth:login' %}" class="btn-secondary py-2 px-4 text-xs inline-flex items-center justify-center gap-1.5">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        Back to login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
